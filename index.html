<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>동명공고 교사 시간표 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Vercel Web Analytics 스크립트 -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
    <style>
      :root { --school-blue: #1554a3; --school-blue-light: #eaf2fc; --free-bg: #eef0f2; --free-text: #6c757d; }
      body { min-height: 100vh; margin: 0; padding: 24px 12px; background: #f6f8fb; font-family: 'Malgun Gothic', sans-serif; color: #212529; }
      .app-container { max-width: 960px; margin: 0 auto; }
      .system-title { color: var(--school-blue); font-size: clamp(1.2rem, 3vw, 1.75rem); }
      .card { border: 0; border-radius: 14px; box-shadow: 0 5px 18px rgba(23, 43, 77, 0.08); }
      
      .main-tabs .nav-link { color: #5c6673; font-weight: 700; padding: 12px 18px; }
      .main-tabs .nav-link.active { color: var(--school-blue); border-bottom: 3px solid var(--school-blue); }
      
      .schedule-wrap { overflow-x: auto; border: 1px solid #dee2e6; border-radius: 10px; background: #fff; }
      .schedule-table { min-width: 700px; margin-bottom: 0; table-layout: fixed; }
      .schedule-table th { background: #f8fafc; color: #4d5968; text-align: center; vertical-align: middle; padding: 10px 4px; border-bottom: 2px solid #dee2e6; }
      .schedule-table td { height: 60px; vertical-align: middle; text-align: center; padding: 6px; border: 1px solid #e9ecef; }
      
      .schedule-table th.period-cell, .schedule-table td.period-cell {
        position: sticky;
        left: 0;
        z-index: 1;
        background: #f8fafc;
        border-right: 2px solid #cdd4dc; 
      }
      .schedule-table thead th.period-cell { z-index: 2; }
      .period-cell { width: 100px; font-weight: 800; color: #4d5968; }
      
      .time-text { font-size: 0.68rem; color: #87929d; font-weight: normal; }
      
      .class-slot { cursor: pointer; font-weight: 700; color: var(--school-blue); transition: background-color .15s, box-shadow .15s; }
      .class-slot:hover { background: var(--school-blue-light); }
      .class-slot.selected { background: #d1e7dd; box-shadow: inset 4px 0 #198754, inset -4px 0 #198754; color: #0f5132; }
      
      .free-slot { cursor: default; background: var(--free-bg) !important; color: var(--free-text); font-weight: 600; font-size: 0.95rem; }
      .club-slot { background: #fff3cd !important; color: #856404; font-weight: 800; } 
      
      .empty-guide { border: 1px dashed #b9c4d0; border-radius: 10px; padding: 38px 16px; text-align: center; color: #6c757d; background: #fbfcfd; }
      .selected-info { min-height: 24px; color: #0f5132; font-size: .92rem; font-weight: 700; }
      
      .loader { display: none; width: 26px; height: 26px; margin: 0 auto; border: 4px solid #e9ecef; border-top-color: var(--school-blue); border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .result-box { display: none; white-space: pre-wrap; padding: 15px; border-radius: 9px; font-size: .95rem; }
      
      .teacher-checkboxes { 
        max-height: 310px; overflow-y: auto; border: 1px solid #dee2e6; padding: 14px; 
        border-radius: 9px; background: #fff; 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
        gap: 10px 8px; 
      }
      .teacher-checkboxes .form-check { margin-bottom: 0; white-space: nowrap; }
      
      @media (max-width: 576px) { body { padding: 16px 8px; } }
    </style>
  </head>
  <body>
    <main class="app-container">
      <h1 class="system-title text-center mb-4 fw-bold">동명공고 교사 시간표 시스템</h1>

      <ul class="nav nav-tabs main-tabs mb-3" id="mainTabs" role="tablist">
        <li class="nav-item flex-fill" role="presentation"><button class="nav-link active w-100" id="schedule-main-tab" data-bs-toggle="tab" data-bs-target="#schedulePane" type="button" role="tab" aria-controls="schedulePane" aria-selected="true">교사 시간표</button></li>
        <li class="nav-item flex-fill" role="presentation"><button class="nav-link w-100" id="meeting-main-tab" data-bs-toggle="tab" data-bs-target="#meetingPane" type="button" role="tab" aria-controls="meetingPane" aria-selected="false">회의 시간 찾기</button></li>
      </ul>

      <div class="tab-content">
        <section class="tab-pane fade show active" id="schedulePane" role="tabpanel" aria-labelledby="schedule-main-tab" tabindex="0">
          <div class="card"><div class="card-body p-3 p-md-4">
            
            <label for="swapTeacher" class="form-label fw-bold mb-1">교사 선택</label>
            <div class="d-flex gap-2 mb-3">
              <select id="swapTeacher" class="form-select"></select>
              <div class="btn-group" role="group" style="flex-shrink: 0;">
                <button type="button" class="btn btn-outline-secondary" onclick="changeWeek(-1)">◀ 이전주</button>
                <button type="button" class="btn btn-outline-secondary" onclick="changeWeek(0)">이번주</button>
                <button type="button" class="btn btn-outline-secondary" onclick="changeWeek(1)">다음주 ▶</button>
              </div>
            </div>
            
            <div id="scheduleGuide" class="empty-guide">교사를 선택하면 시간표가 표시됩니다.</div>
            
            <div id="weeklySchedule" class="d-none">
              <!-- 시간표 테이블 표시 영역 -->
              <div id="tableContainer"></div>
              
              <!-- ⭐ 1. 결과 시트 열기 버튼 위치 이동 및 텍스트 수정 -->
              <div class="d-flex justify-content-end mt-2 mb-3">
                <button class="btn btn-outline-primary btn-sm fw-bold" type="button" onclick="openSheet()">교체 가능 수업 찾기 주간 시간표로 확인(새창)</button>
              </div>
            </div>
            
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-success flex-grow-1" type="button" onclick="findSwaps()">교체 가능 수업 찾기</button>
              <button class="btn btn-outline-secondary" type="button" onclick="resetSwapResult()">초기화</button>
            </div>
            
            <!-- ⭐ 2. 안내 문구 위치 이동 및 텍스트(마침표 제거) 수정 -->
            <p class="selected-info mt-3 mb-2 text-center" id="selectedClassInfo">교체할 수업을 시간표에서 선택해 주세요 (여러 개 선택 가능)</p>
            
            <div class="text-center mt-3"><div id="loader1" class="loader"></div></div>
            <div id="result1" class="result-box mt-3"></div>
          </div></div>
        </section>

        <section class="tab-pane fade" id="meetingPane" role="tabpanel" aria-labelledby="meeting-main-tab" tabindex="0">
          <div class="card"><div class="card-body p-3 p-md-4">
            <h2 class="h5 fw-bold text-primary mb-3">회의 시간 찾기</h2>
            <label class="form-label fw-bold">회의 시간을 맞출 교사 선택 <span class="text-muted fw-normal">(2명 이상)</span></label>
            
            <div id="teacherCheckboxes" class="teacher-checkboxes mb-3"></div>
            
            <div class="d-flex gap-2">
              <button class="btn btn-primary flex-grow-1" type="button" onclick="findFreeSlots()">회의 가능 시간 찾기</button>
              <button class="btn btn-outline-secondary" type="button" onclick="resetFreeResult()">초기화</button>
            </div>
            <div class="text-center mt-3"><div id="loader2" class="loader"></div></div>
            <div id="result2" class="result-box mt-3"></div>
          </div></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // =============================================================
      // 필수 설정: Apps Script를 웹 앱으로 배포한 뒤 /exec 주소를 입력하세요.
      // =============================================================
      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhUkc7Cwk4ThTEPuxtGqizU8s5woapd3gy8aDEt7ALUOd6CPCz5xK15ccdAvyKbd_log/exec';

      window.appData = null;
      window.sheetUrl = '';
      window.selectedPeriodCols = [];
      window.weekOffset = 0; 

      const WEEKDAYS = [
        { key: 'mon', short: '월', long: '월요일' },
        { key: 'tue', short: '화', long: '화요일' },
        { key: 'wed', short: '수', long: '수요일' },
        { key: 'thu', short: '목', long: '목요일' },
        { key: 'fri', short: '금', long: '금요일' }
      ];
      
      const PERIOD_TIMES = ['08:50~09:40', '09:50~10:40', '10:50~11:40', '11:50~12:40', '13:30~14:20', '14:30~15:20', '15:30~16:20'];

      window.addEventListener('load', function () {
        callAppsScript('getInitialData').then(populateData).catch(showLoadError);
      });

      async function callAppsScript(action, payload) {
        if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_URL)) {
          throw new Error('index.html의 APPS_SCRIPT_URL에 Apps Script 웹 앱의 /exec 주소를 입력해 주세요.');
        }
        const separator = APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&';
        const requestUrl = APPS_SCRIPT_URL + separator + 'action=' + encodeURIComponent(action);
        const response = await fetch(requestUrl, {
          method: 'POST', redirect: 'follow', cache: 'no-store',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload || {})
        });
        if (!response.ok) throw new Error('Apps Script 응답 오류: HTTP ' + response.status);
        const text = await response.text();
        try { return JSON.parse(text); } 
        catch (error) { throw new Error('JSON 응답 오류. 배포 URL을 확인해 주세요.'); }
      }

      function populateData(data) {
        window.appData = data;
        window.sheetUrl = data.sheetUrl;
        const teacherSelect = document.getElementById('swapTeacher');
        const teacherChecks = document.getElementById('teacherCheckboxes');
        teacherSelect.innerHTML = '<option value="" selected>선택하세요</option>';
        teacherChecks.innerHTML = '';
        data.teachers.forEach(function (teacher) {
          teacherSelect.add(new Option(teacher.name, teacher.row));
          const item = document.createElement('div');
          item.className = 'form-check';
          item.innerHTML = '<input class="form-check-input t-check" type="checkbox" value="' + teacher.row + '" id="chk' + teacher.row + '"><label class="form-check-label" for="chk' + teacher.row + '">' + escapeHtml(teacher.name) + '</label>';
          teacherChecks.appendChild(item);
        });
        teacherSelect.addEventListener('change', renderSelectedTeacherSchedule);
      }

      function showLoadError(error) {
        document.getElementById('scheduleGuide').textContent = '시간표 정보를 불러오지 못했습니다. ' + getErrorMessage(error);
      }

      function changeWeek(delta) {
        if (delta === 0) {
          window.weekOffset = 0; 
        } else {
          window.weekOffset += delta; 
        }
        renderSelectedTeacherSchedule(); 
      }

      function renderSelectedTeacherSchedule() {
        const selectedRow = Number(document.getElementById('swapTeacher').value);
        const guide = document.getElementById('scheduleGuide');
        const schedule = document.getElementById('weeklySchedule');
        
        window.selectedPeriodCols = [];
        
        // ⭐ 교사 선택 시 초기화되는 텍스트 수정 반영
        document.getElementById('selectedClassInfo').textContent = '교체할 수업을 시간표에서 선택해 주세요 (여러 개 선택 가능)';
        
        if (!window.appData || !selectedRow) { guide.classList.remove('d-none'); schedule.classList.add('d-none'); return; }
        const teacher = window.appData.teachers.find(function (item) { return item.row === selectedRow; });
        if (!teacher) return;
        guide.classList.add('d-none');
        schedule.classList.remove('d-none');
        
        buildWeeklyTable(teacher);
      }

      function buildWeeklyTable(teacher) {
        const container = document.getElementById('tableContainer');
        const weekDates = getCurrentWeekDates(); 
        
        let thead = '<thead><tr><th class="period-cell">교시</th>';
        WEEKDAYS.forEach(function (day, idx) {
          thead += '<th>' + day.short + '요일<br><span class="time-text">' + formatMonthDay(weekDates[idx]) + '</span></th>';
        });
        thead += '</tr></thead>';

        let tbody = '<tbody>';
        for (let p = 1; p <= 7; p++) {
          let row = '<tr><td class="period-cell">' + p + '교시<br><span class="time-text">' + PERIOD_TIMES[p - 1] + '</span></td>';
          
          WEEKDAYS.forEach(function (day) {
            if (day.short === '금' && p === 7) {
              row += '<td class="free-slot club-slot">동아리</td>';
              return;
            }

            const periodInfo = findPeriod(day.long, p);
            const classText = periodInfo ? teacher.schedule[periodInfo.col] : '';
            const isFree = !classText;
            
            if (isFree || !periodInfo) {
              row += '<td class="free-slot"></td>';
            } else {
              row += '<td class="class-slot" data-col="' + periodInfo.col + '" data-label="' + escapeHtml(day.long + ' ' + p + '교시 ' + classText) + '">' + escapeHtml(classText) + '</td>';
            }
          });
          row += '</tr>';
          tbody += row;
        }
        tbody += '</tbody>';

        container.innerHTML = '<div class="schedule-wrap"><table class="table schedule-table">' + thead + tbody + '</table></div>';
        
        container.querySelectorAll('.class-slot').forEach(function (cell) {
          cell.addEventListener('click', function () { selectClassSlot(cell); });
        });
      }

      function findPeriod(dayName, periodNumber) {
        if (!window.appData) return null;
        const expectedName = dayName + ' ' + periodNumber + '교시';
        return window.appData.periods.find(function (period) { return period.name === expectedName; }) || null;
      }

      function selectClassSlot(cell) {
        cell.classList.toggle('selected');
        
        const selectedCells = document.querySelectorAll('.class-slot.selected');
        window.selectedPeriodCols = Array.from(selectedCells).map(function(item) {
          return Number(item.dataset.col);
        });
        
        const infoEl = document.getElementById('selectedClassInfo');
        if (window.selectedPeriodCols.length === 0) {
          // ⭐ 항목 선택이 없을 경우 텍스트 수정 반영
          infoEl.textContent = '교체할 수업을 시간표에서 선택해 주세요 (여러 개 선택 가능)';
        } else if (window.selectedPeriodCols.length === 1) {
          infoEl.textContent = '선택한 수업: ' + selectedCells[0].dataset.label;
        } else {
          infoEl.textContent = '선택한 수업: 총 ' + window.selectedPeriodCols.length + '개 선택됨';
        }
      }

      function getCurrentWeekDates() {
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        
        today.setDate(today.getDate() + (window.weekOffset * 7));
        
        const day = today.getDay();
        const mondayOffset = day === 0 ? -6 : 1 - day;
        const monday = new Date(today);
        monday.setDate(today.getDate() + mondayOffset);
        
        return WEEKDAYS.map(function (_, index) { 
          const date = new Date(monday); 
          date.setDate(monday.getDate() + index); 
          return date; 
        });
      }

      function formatMonthDay(date) { return (date.getMonth() + 1) + '. ' + date.getDate() + '.'; }
      function openSheet() { if (window.sheetUrl) window.open(window.sheetUrl, '_blank'); else alert('시트 주소를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.'); }

      function findSwaps() {
        const row = Number(document.getElementById('swapTeacher').value);
        const cols = window.selectedPeriodCols;
        
        if (!row || cols.length === 0) { alert('교사를 선택한 뒤 시간표에서 교체할 수업을 하나 이상 선택해 주세요.'); return; }
        
        toggleLoading('loader1', 'result1', true);
        
        callAppsScript('runRecommendSwapsWeb', { targetRow: row, targetCols: cols })
          .then(function (res) { showResult('loader1', 'result1', res, 'success'); })
          .catch(function (error) { showRequestError('loader1', 'result1', error); });
      }

      function resetSwapResult() {
        hideResult('result1');
        document.getElementById('swapTeacher').value = '';
        window.weekOffset = 0; 
        renderSelectedTeacherSchedule();
        callAppsScript('runResetColorsWeb').catch(function (error) { console.error(error); });
      }

      function findFreeSlots() {
        const selectedRows = Array.from(document.querySelectorAll('.t-check:checked')).map(function (check) { return check.value; });
        if (selectedRows.length < 2) { alert('회의 시간을 찾을 교사를 2명 이상 선택해 주세요.'); return; }
        toggleLoading('loader2', 'result2', true);
        callAppsScript('runFindCommonFreeWeb', { selectedRows: selectedRows })
          .then(function (res) { showResult('loader2', 'result2', res, 'primary'); })
          .catch(function (error) { showRequestError('loader2', 'result2', error); });
      }

      function resetFreeResult() {
        hideResult('result2');
        document.querySelectorAll('.t-check').forEach(function (check) { check.checked = false; });
        callAppsScript('runResetColorsWeb').catch(function (error) { console.error(error); });
      }

      function toggleLoading(loaderId, resultId, isLoading) { document.getElementById(loaderId).style.display = isLoading ? 'block' : 'none'; if (isLoading) hideResult(resultId); }
      function showResult(loaderId, resultId, response, successColor) {
        toggleLoading(loaderId, resultId, false);
        const box = document.getElementById(resultId);
        box.style.display = 'block'; box.innerHTML = response.message;
        box.className = response.success ? 'result-box mt-3 bg-' + successColor + ' text-white' : 'result-box mt-3 bg-warning text-dark';
      }
      function showRequestError(loaderId, resultId, error) {
        toggleLoading(loaderId, resultId, false);
        const box = document.getElementById(resultId);
        box.style.display = 'block'; box.className = 'result-box mt-3 bg-danger text-white'; box.textContent = '요청을 처리하지 못했습니다. ' + getErrorMessage(error);
      }
      function hideResult(resultId) { const box = document.getElementById(resultId); box.style.display = 'none'; box.textContent = ''; }
      function getErrorMessage(error) {
        const message = error && error.message ? error.message : String(error || '알 수 없는 오류입니다.');
        if (message === 'Failed to fetch') return 'Apps Script 웹 앱의 배포 URL을 확인해 주세요.';
        return message;
      }
      function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, function (char) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]; }); }
    </script>
  </body>
</html>
